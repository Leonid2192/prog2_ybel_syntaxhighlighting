name: Java CI Pipeline

# Trigger: Wann soll der Roboter anspringen?
on:
    pull_request:
        branches:
            - master
            - main
    workflow_dispatch: # Ermöglicht das manuelle Starten auf GitHub

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
            - name: Compile Code
              run: ./gradlew classes
    # Job 2: Tests ausführen (Deine Token- und Highlighter-Tests)
    test:
        needs: build # Wartet, bis der Build-Job erfolgreich war
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
            - name: Run JUnit Tests
              run: ./gradlew test

    # Job 3: Formatierung prüfen (Spotless-Plugin des Profs kontrollieren lassen)
    format:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
            - name: Check Code Formatting (Spotless)
              run: ./gradlew spotlessCheck
